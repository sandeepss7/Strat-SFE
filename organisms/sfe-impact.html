<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
</head>

<body>
    <!-- body content start -->

    <section class="sfe-impact">
        <div class="container">
            <!-- heading -->
            <h2 class="sfe-head">The <span>Strat SFE</span> Impact</h2>
            <!-- wrapper -->
            <div class="sfe-impact__wrapper">
                <div class="sfe-impact__item">
                    <div class="sfe-impact__value">90%</div>
                    <h3 class="sfe-impact__title">Reduction</h3>
                    <p class="sfe-impact__desc">
                        in administrative and <br>end-of-day reporting time
                    </p>
                </div>

                <div class="sfe-impact__divider">
                    <img src="../assets/images/sfe-impact-divider.png" alt="divider" />
                </div>

                <div class="sfe-impact__item">
                    <div class="sfe-impact__value">80%</div>
                    <h3 class="sfe-impact__title">Faster</h3>
                    <p class="sfe-impact__desc">
                        access to critical customer<br>
                        data
                    </p>
                </div>

                <div class="sfe-impact__divider">
                    <img src="../assets/images/sfe-impact-divider.png" alt="divider" />
                </div>

                <div class="sfe-impact__item">
                    <div class="sfe-impact__value">50%</div>
                    <h3 class="sfe-impact__title">Improvement</h3>
                    <p class="sfe-impact__desc">
                        in field data accuracy<br>
                        and pipeline visibility
                    </p>
                </div>

                <div class="sfe-impact__divider">
                    <img src="../assets/images/sfe-impact-divider.png" alt="divider" />
                </div>

                <div class="sfe-impact__item">
                    <div class="sfe-impact__value">Higher</div>
                    <h3 class="sfe-impact__title">Sales Productivity</h3>
                    <p class="sfe-impact__desc">
                        More time selling, less<br>
                        time reporting
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
</body>

</html>
