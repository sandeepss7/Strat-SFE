<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
</head>

<body>
    <!-- body content start -->

    <div class="sfe-specs">
        <div class="container">
            <div class="sfe-specs__wrapper">
                <!-- Card 01 -->
                <div class="sfe-specs__card card-a">
                    <div class="sfe-specs__icon">
                        <img src="../assets/images/language-icon.svg" alt="Multi-Language Support">
                    </div>
                    <div class="sfe-specs__content">
                        <h3 class="sfe-specs__title">Multi-Language Support</h3>
                        <p class="sfe-specs__text">
                            Supporting global teams in multiple languages
                        </p>
                    </div>
                </div>
                <!-- Card 02 -->
                <div class="sfe-specs__card card-b">
                    <div class="sfe-specs__icon">
                        <img src="../assets/images/data-security-icon.svg" alt="Data Security">
                    </div>
                    <div class="sfe-specs__content">
                        <h3 class="sfe-specs__title">Data Security</h3>
                        <p class="sfe-specs__text">
                            Enterprise-grade security &amp; compliance
                        </p>
                    </div>
                </div>
                <!-- Card 03 -->
                <div class="sfe-specs__card card-c">
                    <div class="sfe-specs__icon">
                        <img src="../assets/images/scalable_reliable_icon.svg" alt="Scalable & Reliable">
                    </div>
                    <div class="sfe-specs__content">
                        <h3 class="sfe-specs__title">Scalable &amp; Reliable</h3>
                        <p class="sfe-specs__text">
                            Built to scale with your growing business
                        </p>
                    </div>
                </div>
                <!-- Card 04 -->
                <div class="sfe-specs__card card-d">
                    <div class="sfe-specs__icon">
                        <img src="../assets/images/support-icon.svg" alt="Local Support, Global Standards">
                    </div>
                    <div class="sfe-specs__content">
                        <h3 class="sfe-specs__title">Local Support,<br>Global Standards</h3>
                        <p class="sfe-specs__text">
                            Local teams with global service excellence
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
</body>
