<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Demo Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Simulating the patterned background from the image */
            background: linear-gradient(135deg, #fdfdfd 0%, #f4f4f4 50%, #e8bcbc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .form-container h2 {
            text-align: center;
            color: #000000;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 15px 20px;
            /* Subtle shadow to mimic the floating inputs */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .input-group i {
            color: #d82b33; /* Red icon color */
            font-size: 1.2rem;
            width: 30px;
            text-align: center;
            margin-right: 15px;
        }

        .input-group input,
        .input-group select {
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            color: #333;
            background: transparent;
            /* Removes default select styling */
            appearance: none; 
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .input-group input::placeholder {
            color: #a0a0a0;
            font-weight: 500;
        }

        /* Adding a custom dropdown arrow for select elements */
        .select-group {
            position: relative;
        }
        
        .select-group::after {
            content: '\f107'; /* FontAwesome down arrow */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 20px;
            color: #ccc;
            pointer-events: none;
        }

        .submit-btn {
            width: 100%;
            background-color: #d82b33;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #b9242b;
        }

        .secure-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            color: #111;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .secure-notice i {
            margin-right: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Request a Personalised Demo</h2>
        
        <form action="#" method="POST">
            
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Work Email" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-building"></i>
                <input type="text" placeholder="Company Name" required>
            </div>

            <div class="input-group select-group">
                <i class="fa-solid fa-industry"></i>
                <select required>
                    <option value="" disabled selected hidden>Industry</option>
                    <option value="tech">Technology</option>
                    <option value="finance">Finance</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="retail">Retail</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="input-group select-group">
                <i class="fa-solid fa-user-group"></i>
                <select required>
                    <option value="" disabled selected hidden>Sales Team Size</option>
                    <option value="1-10">1 - 10</option>
                    <option value="11-50">11 - 50</option>
                    <option value="51-200">51 - 200</option>
                    <option value="200+">200+</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Speak with an Expert</button>
            
        </form>

        <div class="secure-notice">
            <i class="fa-solid fa-lock"></i>
            <span>Your information is secure and confidential.</span>
        </div>
    </div>

</body>
</html>
